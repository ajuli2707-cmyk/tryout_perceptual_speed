.fb{margin-top:12px;padding:10px 12px;border-radius:12px;font-size:.92rem}.fb.ok{background:var(--okb)}.fb.no{background:var(--badb)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.pal{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.pal button{font:inherit;font-size:.72rem;padding:6px 0;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.pal .done{background:var(--tile);border-color:var(--pri)}.pal .ok{background:var(--okb);border-color:var(--ok)}.pal .no{background:var(--badb);border-color:var(--bad)}.pal .cur{outline:2px solid var(--pri2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center}.stats b{display:block;font-size:1.6rem}
table{width:100%;border-collapse:collapse;font-size:.92rem}td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.rv{border-top:1px solid var(--line);padding:10px 0}.tag{font-weight:700}.tag.ok{color:var(--ok)}.tag.no{color:var(--bad)}
.tabs{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
@media(max-width:520px){.modes{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

function pick(k){var s=S.sec;if(S.mode==="latihan"&&S.ans[s][S.i]!==undefined)return;S.ans[s][S.i]=k;quiz()}
$.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b||b.disabled)return;var a=b.dataset.a;
if(a==="go")go(b.dataset.m);else if(a==="pick")pick(+b.dataset.k);else if(a==="next")mv(1);else if(a==="prev")mv(-1);else if(a==="jump"){S.i=+b.dataset.j;quiz()}
else if(a==="end"){var n=S.qs[S.sec].length-S.ans[S.sec].filter(function(x){return x!==undefined}).length;if(!n||confirm("Masih ada "+n+" soal kosong. Lanjut?"))endSec()}
else if(a==="b2"){S.sec=1;begin()}else if(a==="flt"){S.f=b.dataset.f;result()}else if(a==="pk"){S.pk=+b.dataset.k;start()}else if(a==="home")start()});
document.addEventListener("keydown",function(e){if(S.view!=="quiz")return;var k="abcde".indexOf(e.key.toLowerCase());if(k<0&&/^[1-5]$/.test(e.key))k=+e.key-1;
if(k>=0&&e.key.length===1)pick(k);else if(e.key==="ArrowRight")mv(1);else if(e.key==="ArrowLeft")mv(-1)});
start();
})();
</script>
</body>
</html>
